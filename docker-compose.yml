# API et interface exposées sur 127.0.0.1 uniquement (ENF-SEC-01).
# La base de production est hébergée par Neon (ADR-11) ; le service `db` est la base LOCALE de test (ADR-12).
# Les variables vides ne bloquent pas Compose : le backend valide sa configuration au démarrage et s'arrête si elle est invalide.
name: tracandi
services:
  # PostgreSQL local pour les tests d'intégration et la restauration de contrôle : jamais de donnée réelle.
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:-tracandi_test}
      POSTGRES_USER: ${TEST_DB_USER:-tracandi_test}
      # Valeur par défaut acceptable : base jetable, sans donnée réelle, joignable seulement depuis 127.0.0.1.
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-tracandi_test}
    volumes:
      - pg-test-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  # Exécution unique des migrations avec le rôle propriétaire ; le backend ne reçoit jamais cette URL (ENF-SEC-09).
  migrate:
    build: ./backend
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL_MIGRATOR: ${DATABASE_URL_MIGRATOR}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Moindre privilège : seules les variables utiles à l'application.
  backend:
    build: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL_APP: ${DATABASE_URL_APP}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      SCRAPER_CONTACT_EMAIL: ${SCRAPER_CONTACT_EMAIL:-}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Europe/Paris}
      CRON_GMAIL: ${CRON_GMAIL:-*/30 * * * *}
      CRON_SCRAPER: ${CRON_SCRAPER:-0 7,13,19 * * *}
      # LibreOffice a besoin d'un HOME inscriptible ; le reste du système de fichiers est en lecture seule.
      HOME: /tmp
    volumes:
      - ./backend/data:/app/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://127.0.0.1:4000/api
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  pg-test-data:
